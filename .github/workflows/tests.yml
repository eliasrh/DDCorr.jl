name: Numerical and interface tests
on: [push, pull_request]
jobs:
  workshop-install:
    name: Workshop installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.3'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_install.py
      - name: Run Saturday's supplied DDSync and GraphSplit example
        run: |
          julia --threads=2 teaching/saturday/workshop.jl sync --run laptop-check
          julia --threads=2 teaching/saturday/workshop.jl relocate --run laptop-check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=. --threads=2 test/runtests.jl
      - run: python -m pip install -r requirements-download.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/make_synthetic.py --output examples/synthetic
      - run: julia --project=. --threads=2 bin/ddcorr.jl DDCorr.toml --inspect
      - name: Prepare explicit-pair course configuration
        run: |
          python - <<'PYCONFIG'
          from pathlib import Path
          text=Path('DDCorr.toml').read_text().replace('max_examples = 12','max_examples = 1').replace('event_pairs = []','event_pairs = [[1,2],[2,3]]',1).replace('dense = false','dense = true')
          text = text.replace('[output]', '[output]\nnear_identity_cc = 0.70')
          Path('course_test.toml').write_text(text)
          PYCONFIG
      - run: julia --project=. --threads=2 bin/ddcorr.jl course_test.toml
      - name: Check figures, selection and timing representation
        run: |
          ddcorr_run=$(ls -dt results/correlate_*/ | head -n 1)
          python scripts/check_course_outputs.py "$ddcorr_run"
      - name: Check timing against independent synthetic truth
        run: |
          ddcorr_run=$(ls -dt results/*/ | head -n 1)
          python scripts/check_synthetic.py --truth-dir examples/synthetic --run-dir "$ddcorr_run" --max-error-s 0.01 --require-noise-isolated

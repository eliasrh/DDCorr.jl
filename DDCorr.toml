# DDCorr: the settings to explore in class. Times are seconds, bands are Hz.
# Paths below are relative to this TOML. Override input with --sac-dir PATH.
# Start with: python3 scripts/make_synthetic.py
# Then: julia --project=. --threads=auto bin/ddcorr.jl DDCorr.toml --inspect
#       julia --project=. --threads=auto bin/ddcorr.jl DDCorr.toml

[input]
sac_dir = "examples/synthetic/sac" # one immediate subdirectory per event
p_pick_header = "a" # A contains P arrival relative to the SAC reference time
s_pick_header = "t0" # T0 contains S arrival; change if your archive differs

[output]
directory = "results" # a new timestamped run directory preserves older results

[P]
band_hz = [2.0, 14.0] # retain frequencies where similar P arrivals are clear
window_s = [-0.5, 2.0] # relative to the P pick; include onset and short coda
max_lag_s = 0.5 # search +/- this correction around the picks
min_cc = 0.70 # signed coefficient r threshold, not the exported r^2 weight
sample_rate_hz = 50.0 # resample with an anti-alias filter; native rate must be >= this
min_snr = 1.5 # signal RMS / noise RMS measured before P, after filtering

[S]
min_components = 1 # only components passing min_snr enter the mean; 2 requires both horizontals
band_hz = [2.0, 14.0] # same band is a starting point, not a universal optimum
window_s = [-0.5, 3.0] # relative to the S pick
max_lag_s = 0.5
min_cc = 0.70
sample_rate_hz = 50.0
min_snr = 1.5

[plots]
enabled = true
summary = true # coefficients, lags, station support and graph connectivity
examples = true # waveforms before/after alignment and full lag curve
filters = true # actual filter response and representative waveform spectra
closure = true # station/phase triangle closure, an internal-consistency check
max_examples = 12 # automatic examples only; explicit pairs are not silently capped
# Empty pair lists choose weak/middle/strong ACCEPTED observations automatically.
# Numeric pairs use the event_id COLUMN in event_id_map.csv, NOT original folders.
# [[1, 2], [2, 3]] shows both pairs for every selected station and phase.
event_pairs = []
# Alternatively use original folder names (including nonnumeric names):
original_event_pairs = [] # e.g. [["17", "203"]]; leave event_pairs empty
example_stations = [] # [] = all stations; ["XX.S01"] selects one
example_phases = ["P", "S"] # use ["P"] for P figures only

[matrices]
plots = true # PNG heatmaps appear in the report, even when dense=false
max_plot_events = 500
max_plot_groups = 24
enabled = true # write matrices/index.csv and sparse accepted entries by station/phase; no N-by-N allocation
dense = false # optional CSV matrices; missing means unmeasured/rejected, not zero
max_dense_events = 500
max_dense_cells = 2000000 # total dense cells across station/phase groups

# Optional: copy src/defaults.toml, adjust a few advanced values, then uncomment.
# Every advanced default is documented; effective_config.toml records the merge.
# [advanced]
# file = "my_advanced.toml"

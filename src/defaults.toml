# Advanced DDCorr options. These are loaded before the student-facing TOML.
# To change them without editing source: copy this file and set [advanced].file
# in DDCorr.toml. A partial advanced TOML is allowed; unknown keys are errors.

[input]
depth_unit = "km" # SAC EVDP source units: km or m; export is always km, original files untouched
station_epoch_policy = "skip" # skip: exclude conflicting stations and continue; error: stop; split: separate coordinate groups
origin_tolerance_s = 0.02 # maximum origin disagreement between SAC channels
coordinate_tolerance_deg = 0.0001 # maximum event coordinate disagreement
depth_tolerance_km = 0.01 # maximum event depth disagreement
station_coordinate_tolerance_deg = 0.0001 # station epochs with larger moves must be split
station_elevation_tolerance_m = 10.0 # maximum station elevation disagreement
component_inclination_tolerance_deg = 10.0 # vertical P or horizontal S classification
strict_headers = true # stop with input_issues.csv if a trace/event is malformed

[output]
weight = "cc_squared" # r^2, or 'cc' for abs(r); DDSync base_mode='cc' applies once
write_rejected_pairs = false # optional long table; potentially O(events^2)
dt_decimals = 4 # dt.cc and exported dt/lag values: 0.0001 s; precision is not uncertainty
near_identity_cc = 0.99 # audit highly similar arrivals; never delete events here

[preprocess]
trace_taper_fraction = 0.02 # cosine taper this fraction of EACH trace end
noise_pick_header = "auto" # auto uses the public P header, including for S noise
noise_window_s = [-8.0, -2.0] # before P; avoid measuring P coda as S background
orientation_tolerance_deg = 10.0 # compare same channel only with consistent axes

[quality]
polarity = "positive" # positive signed r; absolute also permits reversed polarity
subsample = true # parabolic lag interpolation is NOT an uncertainty estimate
boundary_guard_samples = 1 # reject a maximum on a lag-search boundary
component_pick_tolerance_s = 0.001 # agreement of reduced pick differences across stacked channels
max_pair_distance_km = 0.0 # 0: compare every pair sharing usable channels

[phase.P]
filter_order = 4 # Butterworth prototype order; bandpass and filtfilt each double it
filter_padding_s = 5.0 # require genuine samples beyond noise and search windows
min_components = 1 # vertical, from CMPINC; Z-name fallback if CMPINC absent
min_peak_gap = 0.10 # winning score minus strongest other local maximum
sidelobe_exclusion_s = 0.04 # exclude immediate peak neighborhood, not entire cycles

[phase.S]
filter_order = 4
filter_padding_s = 5.0
min_components = 1 # public S.min_components overrides this; each retained trace must pass SNR
min_peak_gap = 0.08
sidelobe_exclusion_s = 0.04

[runtime]
max_events = 0 # 0 uses all events; positive selects evenly spaced folders first
resume = true # content-hashed station/phase cache; scientific outputs stay immutable
cache_dir = ".ddcorr_cache" # relative to the PUBLIC TOML
max_pairs_per_group = 2000000 # fail before expensive pair enumeration; 0 disables
max_group_memory_mib = 1024 # conservative work estimate, not an OS memory limit

[diagnostics]
max_requested_examples = 200 # explicit pair selections fail clearly above this figure count
max_closure_triangles = 100000 # reservoir sample for each station/phase

[downstream]
ddsync_min_edges = 3 # small teaching graphs can have triangles; DDSync's larger default drops them
# Increase this deliberately for large archives; edge count alone is not quality.
ddsync_min_sigma_s = 0.005 # timing uncertainty floor for exported synchronized arrivals

# Internal fallback values/schema for the student interface. Keeping these here
# means edits or typos in the public DDCorr.toml are checked independently.
[interface.input]
sac_dir = "examples/synthetic/sac" # one immediate subdirectory per event
p_pick_header = "a" # A contains P arrival relative to the SAC reference time
s_pick_header = "t0" # T0 contains S arrival; change if your archive differs

[interface.output]
directory = "results" # a new timestamped run directory preserves older results

[interface.P]
band_hz = [2.0, 14.0] # retain frequencies where similar P arrivals are clear
window_s = [-0.5, 2.0] # relative to the P pick; include onset and short coda
max_lag_s = 0.5 # search +/- this correction around the picks
min_cc = 0.70 # signed coefficient r threshold, not the exported r^2 weight
sample_rate_hz = 50.0 # resample with an anti-alias filter; native rate must be >= this
min_snr = 1.5 # signal RMS / noise RMS measured before P, after filtering

[interface.S]
min_components = 1 # one usable horizontal is enough; set 2 to require both
band_hz = [2.0, 14.0] # same band is a starting point, not a universal optimum
window_s = [-0.5, 3.0] # relative to the S pick
max_lag_s = 0.5
min_cc = 0.70
sample_rate_hz = 50.0
min_snr = 1.5

[interface.plots]
enabled = true
summary = true # coefficients, lags, station support and graph connectivity
examples = true # waveforms before/after alignment and full lag curve
filters = true # actual filter response and representative waveform spectra
closure = true # station/phase triangle closure, an internal-consistency check
max_examples = 12 # automatic selection only; explicit pairs are all shown
# Empty = deterministic weak/middle/strong accepted pairs across station+phase.
# Nonempty = output IDs from event_id_map.csv, e.g. [[1, 2], [2, 3]].
# Only accepted observations are shown; selection/unavailable pairs are logged.
event_pairs = [] # numeric event_id column in event_id_map.csv
original_event_pairs = [] # alternative folder labels, e.g. [["17", "203"]]; do not set both
example_stations = [] # empty means all, or ["XX.S01"]
example_phases = ["P", "S"]

[interface.matrices]
plots = true # PNG heatmaps, independent of dense CSV export; also needs plots.enabled=true
max_plot_events = 500 # larger runs skip heatmaps with a reason in matrix_plots.csv
max_plot_groups = 24 # render at most this many station/phase groups
enabled = true # sparse accepted entries by station/phase; no N-by-N allocation
dense = false # optional CSV matrices; missing means unmeasured/rejected, not zero
max_dense_events = 500
max_dense_cells = 2000000 # total dense cells across station/phase groups
